name: app installers

# Makes the demo flight once, builds the desktop app's installers on Linux, Windows and macOS with that
# flight inside, and starts each packaged app once (rust/app/tests/e2e/smoke.js: the app loads and opens
# the demo flight). A version tag (v*) attaches the installers, demo-flight.zip and SHA256SUMS.txt to
# that tag's release; a draft release is made if there is none yet. A push that changes this file, the
# bundle settings, the smoke script or the demo generator builds them as a test, without a release; so
# does a manual run.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - ".github/workflows/release-app.yml"
      - "rust/app/src-tauri/tauri.conf.json"
      - "rust/app/tests/e2e/smoke.js"
      - "demo/make_demo_flight.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  demo:
    name: demo flight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make the demo flight (the same one goes into every installer and into demo-flight.zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          python -m pip install --upgrade pip
          pip install -e .
          python demo/make_demo_flight.py demo-flight --every 4
          rm -f demo-flight/screenshot_config.json
          zip -qr demo-flight.zip demo-flight
          du -sh demo-flight demo-flight.zip
      - uses: actions/upload-artifact@v7
        with:
          name: demo-flight
          path: demo-flight/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: demo-zip
          path: demo-flight.zip
          if-no-files-found: error

  build:
    name: installers (${{ matrix.name }})
    needs: demo
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04 # the oldest supported Ubuntu, so the AppImage runs on older systems too
            args: ""
            bundles: |
              rust/app/src-tauri/target/release/bundle/appimage/*.AppImage
              rust/app/src-tauri/target/release/bundle/deb/*.deb
              rust/app/src-tauri/target/release/bundle/rpm/*.rpm
          - name: Windows
            os: windows-latest
            args: ""
            bundles: |
              rust/app/src-tauri/target/release/bundle/msi/*.msi
              rust/app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin" # one app for Apple silicon and Intel
            bundles: |
              rust/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: demo-flight
          path: rust/app/src-tauri/resources/demo-flight
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: System packages (WebKitGTK, GTK, AppImage tools, a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Build the installers
        working-directory: rust/app
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - name: Smoke test settings
        shell: bash
        run: |
          echo '{"demo": true}' > "$RUNNER_TEMP/smoke-env.json"
      - name: Start the AppImage once (Linux)
        if: runner.os == 'Linux'
        working-directory: rust/app/src-tauri/target/release/bundle/appimage
        run: |
          chmod +x ./*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./*.AppImage --e2e-script "$GITHUB_WORKSPACE/rust/app/tests/e2e/smoke.js" \
            --e2e-env-file "$RUNNER_TEMP/smoke-env.json" --e2e-report "$RUNNER_TEMP/smoke.json" --e2e-timeout 120
      - name: Start the app in its bundle once (macOS)
        if: runner.os == 'macOS'
        working-directory: rust/app/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          ./*.app/Contents/MacOS/thermal-calibration-app --e2e-script "$GITHUB_WORKSPACE/rust/app/tests/e2e/smoke.js" \
            --e2e-env-file "$RUNNER_TEMP/smoke-env.json" --e2e-report "$RUNNER_TEMP/smoke.json" --e2e-timeout 120
      - name: Install with the setup program and start the installed app once (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem rust/app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $p = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList "/S"
          if ($p.ExitCode -ne 0) { Write-Error "setup exit code $($p.ExitCode)"; exit 1 }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter thermal-calibration-app.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "installed app not found"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          # a release build is a GUI program, so wait for it explicitly
          $p = Start-Process -Wait -PassThru -FilePath $exe.FullName -ArgumentList @("--e2e-script", "$env:GITHUB_WORKSPACE\rust\app\tests\e2e\smoke.js", "--e2e-env-file", "$env:RUNNER_TEMP\smoke-env.json", "--e2e-report", "$env:RUNNER_TEMP\smoke.json", "--e2e-timeout", "120")
          if ($p.ExitCode -ne 0) { Write-Error "app exit code $($p.ExitCode)"; exit 1 }
      - name: Smoke report
        if: always()
        shell: bash
        run: |
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify(r, null, 1)); process.exit(r.ok ? 0 : 1)' "$RUNNER_TEMP/smoke.json"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  attach:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: demo-zip
          path: dist
      - name: Upload the installers and the demo flight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # the artifacts keep their bundle folders (appimage/, deb/, msi/, ...): collect the files in one
          # folder, "Thermal Calibration Tool_0.3.0_x64-setup.exe" -> "thermal-calibration-tool_0.3.0_x64-setup.exe"
          mkdir upload
          find dist -type f | while read -r f; do
            cp "$f" "upload/$(basename "$f" | sed -e 's/Thermal Calibration Tool/thermal-calibration-tool/')"
          done
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -l upload
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Installers for $TAG."
          gh release upload "$TAG" upload/* --clobber
