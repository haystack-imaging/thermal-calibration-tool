name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages (Tk, exiftool, virtual display)
        run: sudo apt-get update && sudo apt-get install -y python3-tk libimage-exiftool-perl xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exif,test]" pytest-github-actions-annotate-failures
      - name: Unit, I/O and science tests
        run: python -m pytest tests/test_science.py tests/test_io.py tests/test_demo.py -q
      - name: GUI tests on a virtual display
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest tests/test_core.py tests/test_gui.py -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exif,test]" pytest-github-actions-annotate-failures
      - name: All tests (exiftool-dependent ones are skipped)
        run: python -m pytest tests -q
