name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages (Tk, exiftool, virtual display)
        run: sudo apt-get update && sudo apt-get install -y python3-tk libimage-exiftool-perl xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exif,test]" pytest-github-actions-annotate-failures
      - name: Unit, I/O and science tests
        run: python -m pytest tests/test_science.py tests/test_io.py tests/test_demo.py -q
      - name: GUI tests on a virtual display
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest tests/test_core.py tests/test_gui.py -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exif,test]" pytest-github-actions-annotate-failures
      - name: All tests (exiftool-dependent ones are skipped)
        run: python -m pytest tests -q

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exif,test]" pytest-github-actions-annotate-failures pytest-timeout
      - name: Diagnose the hanging batch test (temporary)
        shell: bash
        run: |
          sw_vers; python -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"
          python -m pytest "tests/test_core.py::test_m1_batch_runs_in_worker_thread" -v -p no:timeout -o faulthandler_timeout=0 &
          pid=$!
          for i in $(seq 1 60); do sleep 1; kill -0 $pid 2>/dev/null || break; done
          if kill -0 $pid 2>/dev/null; then
            echo "still running after 60 s"
            ps -o pid,%cpu,state,time,command -p $pid
            sleep 5; ps -o pid,%cpu,state,time -p $pid
            sample $pid 5 -file "$RUNNER_TEMP/sample.txt" || true
            sed -n '1,220p' "$RUNNER_TEMP/sample.txt" || true
            kill -9 $pid
          fi
          wait $pid; echo "exit $?"
      - name: All tests but that one (exiftool-dependent ones are skipped)
        run: python -m pytest tests -v --timeout 120 --durations 15 --deselect "tests/test_core.py::test_m1_batch_runs_in_worker_thread"
