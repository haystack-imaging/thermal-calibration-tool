[workspace]
resolver = "2"
members = ["crates/thermal-core", "crates/thermal-cli"]
# the Tauri shell is its own project: it needs WebKitGTK, the engine and the CLI do not
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/haystack-imaging/thermal-calibration-tool"

[profile.release]
lto = "thin"
codegen-units = 1
