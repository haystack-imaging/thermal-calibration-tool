[package]
name = "thermal-core"
description = "Empirical-line calibration of thermal and single-band drone images: the engine of the Thermal Calibration Tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = "0.9"
