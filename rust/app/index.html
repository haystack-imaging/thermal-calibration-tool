<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thermal Calibration Tool</title>
    <link rel="icon" href="/src/assets/logo.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><img class="brand-mark" src="/src/assets/logo.svg" alt="" width="26" height="26" /><span class="brand-text"><span class="brand-name">Haystack Imaging</span><span class="brand-sub">Thermal Calibration Tool</span></span></div>
        <input id="title" class="title-input" value="untitled project" spellcheck="false" />
        <span id="saved" class="muted"></span>
        <span class="spacer"></span>
        <button id="btn-undo" class="btn" disabled>↶ Undo</button>
        <button id="btn-redo" class="btn" disabled>↷ Redo</button>
        <button id="btn-new" class="btn">New</button>
        <span class="menu-wrap">
          <button id="btn-open" class="btn" aria-haspopup="menu" aria-expanded="false">Open ▾</button>
          <div id="open-menu" class="menu" role="menu" hidden>
            <button id="btn-open-project" role="menuitem">Open project…<span class="kbd">Ctrl+O</span></button>
            <button id="btn-open-demo" role="menuitem">Open demo flight<span class="kbd">no drone needed</span></button>
          </div>
        </span>
        <button id="btn-save" class="btn">Save</button>
        <button id="btn-save-as" class="btn">Save as…</button>
        <button id="btn-help" class="btn">Help</button>
      </header>
      <div id="body">
        <aside id="rail"></aside>
        <main id="center">
          <section id="image-view">
            <div id="image-toolbar">
              <span id="image-name" class="bold">No image</span>
              <span id="image-info" class="muted tiny"></span>
              <span class="spacer"></span>
              <div class="seg" id="zoom-seg">
                <button class="seg-btn" data-zoom="fit">Fit</button>
                <button class="seg-btn" data-zoom="1">1:1</button>
              </div>
              <div class="seg" id="viz-seg">
                <button class="seg-btn selected" data-viz="inferno">Inferno</button>
                <button class="seg-btn" data-viz="grey">Grey</button>
                <button class="seg-btn" data-viz="clahe">CLAHE</button>
              </div>
            </div>
            <canvas id="viewer"></canvas>
          </section>
          <section id="process-view" hidden></section>
          <section id="timeline"></section>
        </main>
        <aside id="fit-panel"></aside>
      </div>
      <footer id="status">
        <span id="status-text">Add calibration images to begin.</span>
        <span class="spacer"></span>
        <span id="zoom-label" class="muted"></span>
        <span id="mode-label" class="muted">Thermal</span>
      </footer>
    </div>
    <div id="tip" hidden></div>
    <div id="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
