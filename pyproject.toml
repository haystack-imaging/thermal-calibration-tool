[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-calibration-tool"
version = "0.3.0"
description = "GUI to correct thermal (and single-band multispectral) drone images with the Empirical Line Method using field calibration targets"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Moritz Nelle" }]
requires-python = ">=3.10"
keywords = ["thermal imaging", "UAV", "drone", "radiometric calibration", "empirical line method", "phenotyping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "Pillow>=9.0",
    "opencv-python>=4.5",
    "rasterio>=1.2",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
exif = ["piexif>=1.1.3"]
test = ["pytest>=7", "pytest-timeout>=2"]

[project.scripts]
thermal-calibration-tool = "thermal_calibration_tool:main"

[project.urls]
Homepage = "https://github.com/haystack-imaging/thermal-calibration-tool"
Repository = "https://github.com/haystack-imaging/thermal-calibration-tool"
Issues = "https://github.com/haystack-imaging/thermal-calibration-tool/issues"
Changelog = "https://github.com/haystack-imaging/thermal-calibration-tool/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["thermal_calibration_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a GUI test that stalls (a modal dialog, a thread that never reports) fails with a traceback instead of
# hanging: pytest-timeout kills it, faulthandler prints where it was
timeout = 900
faulthandler_timeout = 300
